name: Build and Upload SDK

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., latest)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    # Runner images are pinned. ubuntu-latest migrates to 26.04 gradually
    # between 2026-10-19 and 2026-11-19, which would otherwise make runs
    # nondeterministic mid-rollout, and only arm64 has no -latest alias.
    # The host image affects LXD, snapd and KVM only -- artifacts are built
    # per base inside containers, driven by platforms: in sdkcraft.yaml.
    strategy:
      # Without this, one architecture failing cancels the other mid-run.
      fail-fast: false
      matrix:
        include:
          # One amd64 leg runs the suite. The reusable workflow invokes
          # `sdkcraft test` unscoped, so that single leg packs every amd64 base
          # and executes all three spread variants -- full coverage. Running it
          # on the other legs repeats the identical three variants.
          - platforms: [ubuntu@24.04:amd64]
            runs-on: [ubuntu-24.04]
            run-tests: true
          - platforms: [ubuntu@22.04:amd64, ubuntu@26.04:amd64]
            runs-on: [ubuntu-24.04]
            run-tests: false
          - platforms: [ubuntu@22.04:arm64, ubuntu@24.04:arm64, ubuntu@26.04:arm64]
            runs-on: [ubuntu-24.04-arm]
            # GitHub's arm64 runners have no /dev/kvm, and tests/spread.yaml
            # uses vm: true, so spread cannot allocate a machine there. These
            # artifacts are therefore published WITHOUT being tested; real
            # arm64 coverage needs a self-hosted runner with KVM.
            run-tests: false
    with:
      runs-on: ${{ toJSON(matrix.runs-on) }}
      platforms: ${{ toJSON(matrix.platforms) }}
      platform-flag: "--platform"
      run-tests: ${{ matrix.run-tests }}
      # Publish to edge; promote a verified revision with
      # `sdkcraft release <sdk> <revision> latest/stable`.
      risk: "edge"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}
