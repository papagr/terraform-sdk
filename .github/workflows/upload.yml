name: Build and Upload SDK

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., latest)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# run-tests is deliberately unset: the reusable upload workflow defaults it to
# false, and the suite already ran on the PR that produced this commit. A direct
# push or a workflow_dispatch against latest therefore publishes untested --
# land changes through a PR.
#
# Two named jobs rather than a matrix: separate jobs cannot cancel one another,
# which a matrix does by default.
jobs:
  build-and-upload-amd64:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["ubuntu@22.04:amd64","ubuntu@24.04:amd64","ubuntu@26.04:amd64"]'
      platform-flag: "--platform"
      runs-on: '["ubuntu-24.04"]'
      # Publish to edge; promote a verified revision with
      # `sdkcraft release terraform-papagr <revision> latest/stable`.
      risk: "edge"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}

  build-and-upload-arm64:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["ubuntu@22.04:arm64","ubuntu@24.04:arm64","ubuntu@26.04:arm64"]'
      platform-flag: "--platform"
      runs-on: '["ubuntu-24.04-arm"]'
      risk: "edge"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}
