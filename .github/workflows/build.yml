name: Build SDK

on:
  pull_request:
    branches:
      - latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: canonical/sdkcraft-actions/.github/workflows/build.yml@main
    strategy:
      matrix:
        include:
          - runs-on: [ubuntu-latest]
          # arm64 on GitHub-hosted runners is unverified: drop this entry if
          # LXD or sdkcraft misbehaves there.
          - runs-on: [ubuntu-24.04-arm]
    with:
      runs-on: ${{ toJSON(matrix.runs-on) }}
