name: Forward-Port from Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  forward-port:
    uses: canonical/sdkcraft-actions/.github/workflows/forward-port.yml@main
    with:
      # JSON array of track branches to forward-port main into. Switch to
      # ${{ vars.LONG_TERM_BRANCHES }} if this list starts changing often.
      # The workflow opens a PR rather than merging, so the forward-port is
      # itself tested by build.yml before it lands on the track.
      long-term-branches: '["latest"]'
